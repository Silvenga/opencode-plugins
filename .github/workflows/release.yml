name: Release

on:
  push:
    branches:
      - master

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        package:
          - name: "@slvnco-opencode/cli"
            dir: packages/cli
          - name: "@slvnco-opencode/config-resolver"
            dir: packages/config-resolver
          - name: "@slvnco-opencode/model-providers"
            dir: packages/model-providers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: pnpm
      - name: Validate
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm test
          pnpm --filter "${{ matrix.package.name }}" pack --dry-run
      - name: Publish
        working-directory: ${{ matrix.package.dir }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if pnpm view "${{ matrix.package.name }}@$version" version >/dev/null 2>&1; then
            echo "${{ matrix.package.name }}@$version is already published"
          else
            pnpm publish --access public --no-git-checks
          fi
